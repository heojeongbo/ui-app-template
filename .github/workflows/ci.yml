name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per branch. A force-push mid-run should cancel the old one rather
  # than race it to the status check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no browser. Ordered cheapest-first so a formatting
  # mistake fails in thirty seconds instead of after a Playwright install.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: FSD boundaries
        # Layer direction and barrel-only imports. Biome has no rule for this,
        # so without steiger they are enforced by review alone.
        run: pnpm fsd:check

      - name: Type check
        run: pnpm type:check

      - name: Unit and scenario tests
        run: pnpm test

      - name: Protobuf codegen is current
        # The generated tree is committed so a fresh clone needs no buf. This
        # is what stops it from drifting from the .proto that produced it.
        run: |
          pnpm gen:proto
          git diff --exit-code -- packages/interfaces/src/gen \
            || { echo "::error::Generated protobuf is stale. Run 'pnpm gen:proto' and commit the result."; exit 1; }

      - name: Route tree is current
        # routeTree.gen.ts is committed and regenerated by the build. A stale
        # one type-checks and routes to the wrong place.
        run: |
          pnpm --filter @template/web exec vite build
          git diff --exit-code -- apps/web/src/routeTree.gen.ts \
            || { echo "::error::routeTree.gen.ts is stale. Build the app and commit the result."; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C e2e install-browsers

      - name: End-to-end
        # Builds the app and drives the real bundle — see e2e/playwright.config.ts.
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        # `always()`, because the report is only interesting when something
        # failed and `if: failure()` skips it on a cancelled run.
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
