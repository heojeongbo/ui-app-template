<!doctype html>
<!--
	`lang` and `dir` are the values before React boots; LocaleProvider
	corrects them once the persisted locale has rehydrated. Stating `dir`
	here rather than relying on its default makes the later write obviously
	the same knob rather than a new one.
-->
<html lang="en-US" dir="ltr" class="">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			The title the browser shows BEFORE React boots. Every route replaces
			it through its `head` option (see src/routes/__root.tsx), so this is a
			fallback, not the source. It stays a literal because nothing here can
			read a TypeScript module — `pnpm rename:scope` rewrites this line and
			`shared/content/app.content.ts` together.
		-->
		<title>ui-app-template</title>

		<!--
			A CLASSIC script, and deliberately before the module below.

			`import.meta.env.VITE_*` is inlined at build time, so a built image
			cannot be re-pointed at a different backend. This file is rewritten by
			the container entrypoint at boot; see packages/core/src/config.
			A `type="module"` tag would be deferred and arrive too late.
		-->
		<script src="/config.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
