# Two modules, because the schema imports a vocabulary that is not ours.
#
# `proto/orm` is calque's published SUPERSET of buf.build/orm/orm — same
# messages and numbers, plus `RpcOptions.list` and `MessageOptions.scope`.
# Extensions resolve by number, so a schema written against upstream works
# unchanged here; a schema that says `list` or `scope` needs this copy.
# Vendoring it (rather than taking the BSR dep) is also what makes codegen work
# with no network.
version: v2
modules:
  - path: proto/orm
  - path: proto/schema
lint:
  use:
    - STANDARD
  # Vendored vocabulary. Its style is upstream's to decide, and "fixing" it
  # here would be undone by the next re-vendor.
  ignore:
    - proto/orm
    # Generated by pass 1 and re-read by pass 2. calque names its RPCs
    # Add/Get/Patch/Erase/List, which STANDARD rejects; the shape is
    # calque's to choose, not ours to lint.
    - proto/schema/example/v1/item_svc.g.proto
