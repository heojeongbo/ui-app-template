server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback: the router owns every path, so an unknown one must reach
  # index.html rather than 404 at the web server. Without this, a hard refresh
  # on any route but "/" returns nginx's own 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # NEVER cache these two. The hashed assets are immutable and can be cached
  # forever; index.html points at them, and config.js is rewritten at boot —
  # a cached copy of either pins the browser to a previous deployment.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
